<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隋唐聚义村</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<style>
:root {
  --bg: #1a1410;
  --panel-bg: #231a12;
  --border: #4a3828;
  --gold: #c9a55c;
  --gold-dim: #7a6238;
  --text: #d4c5a9;
  --text-dim: #8a7a65;
  --text-bright: #f0e6d2;
  --red: #c0392b;
  --red-bright: #e74c3c;
  --green: #27ae60;
  --green-bright: #2ecc71;
  --blue: #2980b9;
  --orange: #d35400;
  --purple: #8e44ad;
  --accent: #e67e22;
  --font-main: 'SimSun','STSong','Noto Serif CJK SC',serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font-main);font-size:14px;line-height:1.7;}
#app{height:100vh;display:flex;flex-direction:column;}

/* 标题画面 */
.title-screen{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at center,#2c1f14 0%,#0d0a06 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.title-screen .ornament{color:var(--gold-dim);font-size:22px;letter-spacing:10px;margin-bottom:8px;}
.title-screen h1{font-size:48px;color:var(--gold);text-shadow:0 0 30px rgba(201,165,92,.4);letter-spacing:10px;margin:12px 0;}
.title-screen .subtitle{color:var(--text-dim);font-size:14px;letter-spacing:6px;margin-bottom:40px;}
.title-screen .btn{display:block;width:200px;margin:7px auto;padding:10px 0;border:1px solid var(--border);background:var(--panel-bg);color:var(--gold);font-family:var(--font-main);font-size:16px;cursor:pointer;transition:all .2s;text-align:center;}
.title-screen .btn:hover{background:var(--border);color:var(--text-bright);border-color:var(--gold);}
.title-screen .version{color:var(--text-dim);font-size:11px;margin-top:28px;}

/* 状态栏 */
.status-bar{display:flex;align-items:center;gap:16px;padding:5px 12px;background:var(--panel-bg);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.stat-item{display:flex;align-items:center;gap:4px;font-size:13px;}
.stat-item .val{color:var(--text-bright);font-weight:bold;min-width:30px;}
.stat-item .lbl{color:var(--text-dim);font-size:11px;}
.status-bar .date-info{margin-left:auto;color:var(--gold-dim);font-size:12px;}

/* 主内容 */
.main-content{flex:1;display:flex;overflow:hidden;}

/* 故事面板 */
.story-panel{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel-bg);}
.story-panel .sh{padding:7px 14px;border-bottom:1px solid var(--border);color:var(--gold);font-size:13px;letter-spacing:2px;}
.story-body{flex:1;overflow-y:auto;padding:10px 14px;scrollbar-width:thin;scrollbar-color:var(--border) var(--bg);}
.story-body::-webkit-scrollbar{width:3px;}
.story-body::-webkit-scrollbar-track{background:var(--bg);}
.story-body::-webkit-scrollbar-thumb{background:var(--border);}
.sline{padding:3px 0;line-height:1.6;}
.sline.player{color:#5dade2;}
.sline.npc{color:var(--green);}
.sline.system{color:var(--text-dim);font-size:12px;}
.sline.narrate{color:var(--text);}
.sline.warning{color:var(--red-bright);}
.sline.reward{color:var(--gold);}
.sline.event{color:var(--accent);}
.sline.divider{color:var(--border);letter-spacing:2px;}

/* 选项区 */
.input-area{padding:7px 12px;border-top:1px solid var(--border);flex-shrink:0;}
.options-grid{display:flex;flex-wrap:wrap;gap:5px;}
.obtn{padding:5px 12px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font-main);font-size:13px;cursor:pointer;transition:all .15s;}
.obtn:hover{border-color:var(--gold);color:var(--gold);}
.obtn.primary{border-color:var(--gold-dim);color:var(--gold);}
.obtn.danger{border-color:var(--red);color:var(--red-bright);}
.obtn.disabled{opacity:.4;cursor:not-allowed;}
.obtn.disabled:hover{border-color:var(--border);color:var(--text);}

/* 右侧面板 */
.right-panels{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.nav-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--panel-bg);overflow-x:auto;}
.nav-tab{padding:7px 14px;border-right:1px solid var(--border);cursor:pointer;color:var(--text-dim);font-size:13px;white-space:nowrap;transition:all .15s;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--gold);background:var(--bg);border-bottom:2px solid var(--gold);}
.panel-content{flex:1;overflow-y:auto;padding:10px 14px;}

/* 卡片 */
.card{background:var(--panel-bg);border:1px solid var(--border);padding:9px 12px;margin-bottom:7px;}
.card.locked{opacity:.5;}
.card .cname{color:var(--text-bright);font-size:14px;font-weight:bold;}
.card .cdesc{color:var(--text-dim);font-size:12px;margin-top:2px;}
.card .cstats{display:flex;flex-wrap:wrap;gap:12px;margin-top:5px;font-size:12px;color:var(--text);}
.card .cactions{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;}
.btn-sm{padding:3px 9px;font-size:12px;font-family:var(--font-main);background:var(--bg);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .15s;}
.btn-sm:hover{border-color:var(--gold);color:var(--gold);}
.btn-sm.gold{border-color:var(--gold-dim);color:var(--gold);}
.btn-sm.red{border-color:var(--red);color:var(--red-bright);}
.btn-sm:disabled{opacity:.4;cursor:not-allowed;}
.section-title{font-size:16px;color:var(--gold);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.badge{display:inline-block;padding:1px 6px;font-size:11px;border-radius:2px;margin-left:4px;}
.badge.sss{background:#5d2a0c;color:#f0a03a;border:1px solid #a06020;}
.badge.ss{background:#1a2a4a;color:#7ab8f5;border:1px solid #3a5a9a;}
.badge.s{background:#1a3a1a;color:#5dbd6a;border:1px solid #2a7a3a;}
.badge.a{background:#2a2a1a;color:#c4bf7a;border:1px solid #6a6a2a;}
.progress-bar{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;}
.hp-bar{background:var(--red);}
.exp-bar{background:var(--blue);}
.loyalty-bar{background:var(--green);}

/* 弹窗 */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--panel-bg);border:1px solid var(--border);min-width:320px;max-width:520px;max-height:80vh;display:flex;flex-direction:column;}
.modal-header{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--gold);font-size:15px;flex-shrink:0;}
.modal-body{padding:14px;overflow-y:auto;flex:1;}
.modal-footer{padding:9px 14px;border-top:1px solid var(--border);display:flex;gap:7px;justify-content:flex-end;flex-shrink:0;}

/* 战斗 */
.combat-hud{display:flex;gap:12px;margin-bottom:10px;}
.combat-side{flex:1;padding:8px;border:1px solid var(--border);background:var(--bg);}
.combat-side .cs-name{color:var(--gold);font-size:13px;margin-bottom:4px;}
.combat-side .cs-hp{font-size:12px;color:var(--text-dim);margin-bottom:3px;}
.combat-vs{display:flex;align-items:center;color:var(--gold);font-size:20px;padding:0 5px;}

/* 大地图 */
.map-grid{font-family:monospace;font-size:13px;line-height:1.8;padding:8px;background:var(--bg);border:1px solid var(--border);margin-bottom:10px;color:var(--text-dim);white-space:pre;}
.map-grid .cur{color:var(--gold);}
.map-grid .explored{color:var(--text);}
.map-grid .enemy{color:var(--red-bright);}

/* HP/进度条外层 */
.bar-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.bar-row .bar-label{width:40px;color:var(--text-dim);font-size:11px;}
.bar-wrap{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .4s;}
.fill-red{background:var(--red-bright);}
.fill-green{background:var(--green-bright);}
.fill-blue{background:var(--blue);}
.fill-gold{background:var(--gold);}
</style>
</head>
<body>
<div id="app">
  <!-- 标题画面 -->
  <div v-if="!gs.started" class="title-screen">
    <div class="ornament">◆ ◇ ◆</div>
    <h1>隋唐聚义村</h1>
    <div class="subtitle">大业七年 · 乱世风云</div>
    <button class="btn" @click="startGame('normal')">初出茅庐（普通）</button>
    <button class="btn" @click="startGame('hard')">乱世英雄（困难）</button>
    <button class="btn" @click="startGame('hell')">地狱模式</button>
    <button v-if="hasSave" class="btn" style="margin-top:16px;border-color:var(--gold-dim);" @click="loadGame">继续游戏</button>
    <div class="version">v1.0 | 隋唐聚义村</div>
  </div>

  <!-- 游戏界面 -->
  <template v-else>
    <!-- 状态栏 -->
    <div class="status-bar">
      <div class="stat-item"><span class="lbl">钱币</span><span class="val">{{fmt(gs.gold)}}</span></div>
      <div class="stat-item"><span class="lbl">粮食</span><span class="val">{{fmt(gs.food)}}</span></div>
      <div class="stat-item"><span class="lbl">木材</span><span class="val">{{fmt(gs.wood)}}</span></div>
      <div class="stat-item"><span class="lbl">铁矿</span><span class="val">{{fmt(gs.iron)}}</span></div>
      <div class="stat-item"><span class="lbl">威望</span><span class="val">{{gs.prestige}}</span></div>
      <div class="stat-item"><span class="lbl">人口</span><span class="val">{{gs.population}}</span></div>
      <div class="stat-item"><span class="lbl">民忠</span><span class="val">{{gs.loyalty}}</span></div>
      <div class="date-info">第{{gs.year}}年 · {{SEASONS[gs.season-1]}} · 第{{gs.dayInSeason}}日 | {{WEATHERS[gs.weather].icon}}{{WEATHERS[gs.weather].name}}</div>
    </div>

    <div class="main-content">
      <!-- 故事面板 -->
      <div class="story-panel">
        <div class="sh">聚义纪事</div>
        <div class="story-body" ref="storyBody">
          <div v-for="(l,i) in gs.story" :key="i" :class="'sline '+l.type">{{l.text}}</div>
        </div>
        <div class="input-area">
          <div class="options-grid">
            <button v-for="(opt,i) in gs.options" :key="i"
              :class="['obtn', opt.style||'', opt.disabled?'disabled':'']"
              @click="chooseOpt(i)">{{i+1}}. {{opt.text}}</button>
            <button v-if="gs.options.length===0" class="obtn primary" @click="advanceDay">▶ 推进一日</button>
          </div>
        </div>
      </div>

      <!-- 右侧面板 -->
      <div class="right-panels">
        <div class="nav-tabs">
          <div v-for="t in TABS" :key="t.id" :class="['nav-tab',{active:activeTab===t.id}]" @click="activeTab=t.id">{{t.label}}</div>
        </div>
        <div class="panel-content">

          <!-- 山寨面板 -->
          <div v-if="activeTab==='village'">
            <div class="section-title">🏯 屯兵寨概况</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;font-size:13px;">
              <div>📍 难度：{{['普通','困难','地狱'][['normal','hard','hell'].indexOf(gs.difficulty)]||'普通'}}</div>
              <div>🏛 寨子规模：{{bldLevel('guildhall')}}级</div>
              <div>🏗 已建建筑：{{gs.buildings.length}}座</div>
              <div>⚔ 已征讨势力：{{gs.defeatedFactions.length}}/7</div>
            </div>
            <div v-for="b in gs.buildings" :key="b.id" class="card">
              <div class="cname">{{b.name}} <span style="color:var(--gold-dim)">Lv.{{b.level}}</span>
                <span v-if="b.underConstruction" style="color:var(--accent);font-size:11px;"> [建造中 剩{{b.constructDays}}日]</span>
              </div>
              <div class="cdesc">{{getBldEffect(b)}}</div>
              <div class="progress-bar"><div class="progress-fill fill-gold" :style="{width:(b.level/5*100)+'%'}"></div></div>
              <div class="cactions" v-if="!b.underConstruction">
                <button class="btn-sm gold" @click="upgradeBld(b.id)" :disabled="b.level>=5||!canUpgradeBld(b.id)">升级</button>
                <button class="btn-sm" @click="assignHeroToBld(b.id)">分配武将</button>
              </div>
            </div>
            <div v-if="gs.buildings.length===0" style="color:var(--text-dim);text-align:center;padding:20px;">尚未建造任何建筑</div>
          </div>

          <!-- 建造面板 -->
          <div v-if="activeTab==='build'">
            <div class="section-title">🏗 建设建筑</div>
            <div v-for="bd in BLD_DEFS" :key="bd.id" :class="['card', isUnlocked(bd)?'':'locked']">
              <div class="cname">{{bd.icon}} {{bd.name}}</div>
              <div class="cdesc">{{bd.desc}}</div>
              <div class="cstats">
                <span>钱币{{bd.costGold}}</span>
                <span v-if="bd.costWood">木材{{bd.costWood}}</span>
                <span v-if="bd.costIron">铁矿{{bd.costIron}}</span>
              </div>
              <div v-if="!isUnlocked(bd)" style="color:var(--red-bright);font-size:11px;margin-top:4px;">🔒 {{bd.unlockDesc}}</div>
              <div class="cactions" v-else>
                <span v-if="hasBld(bd.id)" style="color:var(--gold-dim);font-size:12px;">已建造</span>
                <button v-else class="btn-sm gold" @click="buildNew(bd.id)" :disabled="!canBuildNew(bd)">建造</button>
              </div>
            </div>
          </div>

          <!-- 武将面板 -->
          <div v-if="activeTab==='heroes'">
            <div class="section-title">👥 武将管理</div>
            <div v-if="gs.heroes.length>0">
              <div v-for="h in gs.heroes" :key="h.id" class="card">
                <div class="cname">{{h.name}}<span :class="'badge '+h.rank.toLowerCase()">{{h.rank}}</span>
                  <span style="color:var(--gold-dim);font-size:12px"> Lv.{{h.level}}</span></div>
                <div class="cdesc">{{h.title}} · {{h.desc}}</div>
                <div class="cstats">
                  <span>武{{Math.floor(h.atk)}}</span><span>智{{Math.floor(h.int)}}</span>
                  <span>统{{Math.floor(h.cmd)}}</span><span>政{{Math.floor(h.pol)}}</span>
                  <span>魅{{Math.floor(h.chm)}}</span>
                </div>
                <div class="bar-row">
                  <span class="bar-label">经验</span>
                  <div class="bar-wrap"><div class="bar-fill fill-blue" :style="{width:(h.exp/h.expNext*100)+'%'}"></div></div>
                  <span style="font-size:11px;color:var(--text-dim)">{{h.exp}}/{{h.expNext}}</span>
                </div>
                <div class="bar-row">
                  <span class="bar-label">忠诚</span>
                  <div class="bar-wrap"><div class="bar-fill fill-red" :style="{width:h.loyalty+'%'}"></div></div>
                  <span style="font-size:11px;color:var(--text-dim)">{{h.loyalty}}</span>
                </div>
                <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">
                  分配：{{h.assignedTo?getBldName(h.assignedTo):'待命'}} | 技能：{{h.skill}}
                </div>
                <div class="cactions">
                  <button class="btn-sm" @click="heroAssign(h.id)">分配</button>
                  <button class="btn-sm" @click="heroTalk(h.id)">交谈</button>
                  <button class="btn-sm gold" @click="heroGift(h.id)">送礼</button>
                </div>
              </div>
            </div>
            <div style="color:var(--gold-dim);font-size:13px;margin:12px 0 6px;">可招募武将：</div>
            <div v-for="h in recruitableHeroes" :key="h.id" class="card">
              <div class="cname">{{h.name}}<span :class="'badge '+h.rank.toLowerCase()">{{h.rank}}</span></div>
              <div class="cdesc">{{h.title}} · {{h.desc}}</div>
              <div class="cstats">
                <span>武{{h.atk}}</span><span>智{{h.int}}</span><span>统{{h.cmd}}</span><span>政{{h.pol}}</span>
              </div>
              <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">招募：{{h.costGold}}金 + 威望{{h.costPrestige}}</div>
              <div v-if="h.recruitCond&&!isHeroUnlocked(h)" style="color:var(--red-bright);font-size:11px;">🔒 {{h.recruitCond}}</div>
              <div class="cactions" v-else>
                <button class="btn-sm gold" @click="recruitHero(h.id)" :disabled="!canRecruit(h)">招募</button>
              </div>
            </div>
          </div>

          <!-- 军事面板 -->
          <div v-if="activeTab==='military'">
            <div class="section-title">⚔ 军事</div>
            <div style="margin-bottom:10px;font-size:13px;color:var(--text-dim)">总兵力：{{totalTroops}}人</div>
            <div v-for="(td,tk) in TROOP_TYPES" :key="tk" class="card">
              <div class="cname">{{td.icon}} {{td.name}} <span style="color:var(--gold-dim)">现有 {{gs.troops[tk]||0}} 人</span></div>
              <div class="cdesc">{{td.desc}}</div>
              <div class="cstats">
                <span>攻{{td.atk}}</span><span>防{{td.def}}</span><span>HP{{td.hp}}</span>
                <span>粮{{td.costFood}}/人</span><span v-if="td.costIron">铁{{td.costIron}}/人</span>
              </div>
              <div v-if="td.unlockBld && !hasBld(td.unlockBld)" style="color:var(--red-bright);font-size:11px;margin-top:3px;">🔒 需建造{{getBldNameById(td.unlockBld)}}</div>
              <div class="cactions" v-else>
                <input v-model.number="trainCount[tk]" type="number" min="1" max="200" style="width:55px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:2px 5px;font-family:var(--font-main);font-size:12px;">
                <button class="btn-sm gold" @click="trainTroops(tk)">训练</button>
                <span style="font-size:11px;color:var(--text-dim)">费用：金{{(td.costGold||0)*(trainCount[tk]||1)}} 粮{{td.costFood*(trainCount[tk]||1)}}{{td.costIron?` 铁${td.costIron*(trainCount[tk]||1)}`:''}}</span>
              </div>
            </div>

            <div class="section-title" style="margin-top:16px;">7大诸侯</div>
            <div v-for="f in FACTIONS" :key="f.id" class="card" :style="gs.defeatedFactions.includes(f.id)?'opacity:.5':''">
              <div class="cname">{{f.name}} <span style="font-size:11px;color:var(--text-dim)">[{{f.leader}}]</span>
                <span v-if="gs.defeatedFactions.includes(f.id)" style="color:var(--green-bright);font-size:11px;"> ✓已击败</span>
              </div>
              <div class="cdesc">{{f.location}} | {{f.desc}}</div>
              <div class="cstats">
                <span>推荐战力：{{f.powerReq}}</span><span>当前战力：{{myPower}}</span>
              </div>
              <div style="font-size:11px;color:var(--gold);margin-top:3px;">奖励：{{f.rewardDesc}}</div>
              <div class="cactions">
                <button v-if="!gs.defeatedFactions.includes(f.id)" class="btn-sm red"
                  @click="initFactionBattle(f.id)" :disabled="myPower < f.powerReq * 0.6">
                  出征讨伐
                </button>
                <span v-if="myPower < f.powerReq * 0.6" style="font-size:11px;color:var(--red-bright);">战力不足</span>
              </div>
            </div>
          </div>

          <!-- 大地图 -->
          <div v-if="activeTab==='map'">
            <div class="section-title">🗺 大地图</div>
            <div class="map-grid" v-html="renderMap()"></div>
            <div style="font-size:13px;margin-bottom:8px;color:var(--text-dim)">📍 当前位置：{{gs.location}} | 行动点：{{gs.actionPoints}}</div>
            <div v-for="loc in accessibleLocations" :key="loc.id" class="card">
              <div class="cname">{{loc.icon}} {{loc.name}}
                <span v-if="loc.factionId && gs.defeatedFactions.includes(loc.factionId)" style="color:var(--green-bright);font-size:11px;"> [已平定]</span>
                <span v-else-if="loc.factionId" style="color:var(--red-bright);font-size:11px;"> [敌占]</span>
              </div>
              <div class="cdesc">{{loc.desc}}</div>
              <div class="cstats"><span>距离{{loc.distance}}日</span></div>
              <div class="cactions">
                <button class="btn-sm gold" @click="travelTo(loc.id)" :disabled="gs.actionPoints<loc.distance">前往</button>
                <button v-if="!gs.exploredLocations.includes(loc.id)&&loc.canExplore" class="btn-sm" @click="exploreLoc(loc.id)">探索</button>
              </div>
            </div>
          </div>

          <!-- 科技面板 -->
          <div v-if="activeTab==='tech'">
            <div class="section-title">🔬 科技研究</div>
            <div v-for="t in TECH_DEFS" :key="t.id" class="card">
              <div class="cname">{{t.icon}} {{t.name}} <span style="color:var(--gold-dim)">Lv.{{gs.tech[t.id]||0}}/{{t.maxLvl}}</span></div>

// ============================================================
// Vue应用
// ============================================================
const app = createApp({
  setup() {
    const storyBody = ref(null)
    const activeTab = ref('village')
    const modal = reactive({ show:false, title:'', body:'', confirm:null })

    // 核心游戏状态
    const gs = reactive({
      started: false,
      difficulty: 'normal',
      gold: 1000, food: 500, wood: 200, iron: 50,
      prestige: 50, population: 20, loyalty: 80,
      year: 1, season: 1, dayInSeason: 1,
      weather: 0,
      buildings: [],
      heroes: [],
      troops: { infantry:10, archers:0, musketeers:0, cavalry:0 },
      tech: {},
      defeatedFactions: [],
      exploredLocations: ['taiyuan'],
      location: '太原',
      actionPoints: 10,
      story: [],
      options: [],
      combatState: null,
    })

    // 战斗状态
    const combat = reactive({
      active: false,
      factionId: null,
      phase: '',  // 'pre','fighting','result'
      round: 0,
      allyHp: 0, allyMaxHp: 0,
      enemyHp: 0, enemyMaxHp: 0,
      allyMorale: 100, enemyMorale: 100,
      win: false,
    })

    const trainCount = reactive({ infantry:5, archers:5, musketeers:3, cavalry:3 })

    const hasSave = computed(() => !!localStorage.getItem('stjyc_v1'))

    const totalTroops = computed(() => Object.values(gs.troops).reduce((a,b)=>a+b,0))

    const myPower = computed(() => {
      let p = gs.troops.infantry*8 + gs.troops.archers*10 + gs.troops.musketeers*15 + gs.troops.cavalry*13
      p += gs.heroes.length * 20
      const milTech = gs.tech['infantry_tech'] || 0
      p = Math.floor(p * (1 + milTech * 0.08))
      return p
    })

    const recruitableHeroes = computed(() => HERO_DEFS.filter(h => !gs.heroes.find(rh=>rh.id===h.id)))

    const accessibleLocations = computed(() => {
      const explored = gs.exploredLocations
      return MAP_LOCATIONS.filter(loc => {
        if (loc.id === 'taiyuan') return false
        if (explored.includes(loc.id)) return true
        // 相邻已探索区域才显示
        return loc.distance <= (Math.max(...MAP_LOCATIONS.filter(l=>explored.includes(l.id)).map(l=>l.distance||0)) + 2)
      })
    })

    // ---- 工具函数 ----
    function fmt(n) { return n >= 10000 ? (n/10000).toFixed(1)+'万' : n >= 1000 ? Math.floor(n/1000)+'k' : String(n) }

    function addStory(text, type='narrate') {
      if (text === '---') { gs.story.push({ text:'─'.repeat(30), type:'divider' }); return }
      gs.story.push({ text, type })
      if (gs.story.length > 200) gs.story.splice(0, 50)
      nextTick(() => { if (storyBody.value) storyBody.value.scrollTop = storyBody.value.scrollHeight })
    }

    function setOpts(opts) { gs.options = opts }
    function clearOpts() { gs.options = [] }

    function chooseOpt(i) {
      const opt = gs.options[i]
      if (!opt || opt.disabled) return
      clearOpts()
      if (opt.action) opt.action()
    }

    function confirmAct(title, body, fn) {
      modal.title = title; modal.body = body; modal.confirm = fn; modal.show = true
    }

    // ---- 建筑系统 ----
    function hasBld(id) { return !!gs.buildings.find(b=>b.id===id) }
    function bldLevel(id) { const b = gs.buildings.find(b=>b.id===id); return b ? b.level : 0 }
    function getBldName(id) { const b = gs.buildings.find(b=>b.id===id); return b ? b.name : '未知' }
    function getBldNameById(id) { const d = BLD_DEFS.find(b=>b.id===id); return d ? d.name : id }

    function isUnlocked(bldDef) {
      if (bldDef.unlockFaction && !gs.defeatedFactions.includes(bldDef.unlockFaction)) return false
      if (bldDef.unlockBld) {
        const bldLevel_ = bldLevel(bldDef.unlockBld)
        const reqLv = bldDef.unlockBldLevel || 1
        if (bldLevel_ < reqLv) return false
      }
      return true
    }

    function canBuildNew(bldDef) {
      return gs.gold >= bldDef.costGold &&
             gs.wood >= (bldDef.costWood||0) &&
             gs.iron >= (bldDef.costIron||0)
    }

    function buildNew(bldId) {
      const def = BLD_DEFS.find(b=>b.id===bldId)
      if (!def || !isUnlocked(def) || hasBld(bldId)) return
      if (!canBuildNew(def)) { addStory('资源不足，无法建造！', 'warning'); return }
      gs.gold -= def.costGold; gs.wood -= (def.costWood||0); gs.iron -= (def.costIron||0)
      gs.buildings.push({ id:def.id, name:def.name, icon:def.icon, level:1, assignedHero:null, underConstruction:false, constructDays:0, outputType:def.outputType, baseOutput:def.baseOutput||0 })
      activeTab.value = 'village'
      addStory(`建造了【${def.name}】！`, 'reward')
    }

    function getBldUpgradeCost(bldId) {
      const b = gs.buildings.find(b=>b.id===bldId)
      if (!b || b.level >= 5) return null
      const def = BLD_DEFS.find(d=>d.id===bldId)
      if (!def) return null
      const mult = Math.pow(2, b.level)
      return { gold: Math.floor(def.costGold * mult), wood: Math.floor((def.costWood||0)*mult), iron: Math.floor((def.costIron||0)*mult) }
    }

    function canUpgradeBld(bldId) {
      const cost = getBldUpgradeCost(bldId)
      if (!cost) return false
      return gs.gold >= cost.gold && gs.wood >= cost.wood && gs.iron >= cost.iron
    }

    function upgradeBld(bldId) {
      const b = gs.buildings.find(b=>b.id===bldId)
      if (!b || b.level >= 5) { addStory('已达最高等级！', 'warning'); return }
      if (!canUpgradeBld(bldId)) { addStory('资源不足！', 'warning'); return }
      const cost = getBldUpgradeCost(bldId)
      gs.gold -= cost.gold; gs.wood -= cost.wood; gs.iron -= cost.iron
      b.level++
      addStory(`【${b.name}】升级到Lv.${b.level}！`, 'reward')
      // 聚义厅升级触发武将来访
      if (bldId === 'guildhall') checkAutoHeroVisit()
    }

    function getBldEffect(b) {
      const def = BLD_DEFS.find(d=>d.id===b.id)
      if (!def) return ''
      if (def.outputType === 'food') return `粮食 +${Math.floor(def.baseOutput * b.level)}/日`
      if (def.outputType === 'wood') return `木材 +${Math.floor(def.baseOutput * b.level * 0.5)}/日`
      if (def.outputType === 'iron') return `铁矿 +${Math.floor(def.baseOutput * b.level * 0.3)}/日`
      if (def.outputType === 'gold') return `钱币 +${Math.floor(def.baseOutput * b.level)}/日`
      if (def.outputType === 'population') return `人口上限 +${b.level * 8}`
      if (def.outputType === 'prestige') return `威望 +${(def.baseOutput||5) * b.level}/日`
      if (def.outputType === 'military') return `全军攻击 +${b.level*5}%，解锁火铳兵`
      if (def.outputType === 'training') return `训练费 -${b.level*5}%`
      if (def.outputType === 'cavalry') return `解锁骑兵，骑兵攻击 +${b.level*5}%`
      if (def.outputType === 'heal') return `战后伤兵恢复 +${b.level*20}%`
      if (def.outputType === 'core') return `寨子规模 Lv.${b.level}，人口上限 +${b.level*10}`
      return def.desc
    }

    function assignHeroToBld(bldId) {
      const b = gs.buildings.find(b=>b.id===bldId)
      if (!b) return
      const opts = [{ text:'取消（武将待命）', action:()=>{ if(b.assignedHero){const h=gs.heroes.find(h=>h.id===b.assignedHero);if(h)h.assignedTo=null;b.assignedHero=null;addStory(`取消了${b.name}的武将分配。`,'system')} } }]
      for (const h of gs.heroes) {
        opts.push({ text:`${h.name}（武${Math.floor(h.atk)} 政${Math.floor(h.pol)}）`, style:'primary', action:()=>{
          const oldBld = gs.buildings.find(ob=>ob.assignedHero===h.id)
          if (oldBld) { oldBld.assignedHero = null }
          if (b.assignedHero) { const oh = gs.heroes.find(oh=>oh.id===b.assignedHero); if(oh) oh.assignedTo=null }
          b.assignedHero = h.id; h.assignedTo = bldId
          addStory(`${h.name}已分配至【${b.name}】。`, 'system')
        }})
      }
      setOpts(opts)
    }

    // ---- 武将系统 ----
    function isHeroUnlocked(heroDef) {
      if (!heroDef.recruitCond) return true
      const cond = heroDef.recruitCond
      if (cond.includes('击败')) {
        const fMap = { '瓦岗寨':'wagang','王世充':'wangshichong','窦建德':'doujiantian','宇文化及':'yuwenhuaji','杜伏威':'dufuwei','刘武周':'liuwuzhou' }
        for (const [k,v] of Object.entries(fMap)) {
          if (cond.includes(k) && !gs.defeatedFactions.includes(v)) return false
        }
      }
      if (cond.includes('聚义厅Lv2') && bldLevel('guildhall') < 2) return false
      if (cond.includes('聚义厅Lv3') && bldLevel('guildhall') < 3) return false
      if (cond.includes('铁匠铺') && !hasBld('smithy')) return false
      if (cond.includes('马厩') && !hasBld('stable')) return false
      return true
    }

    function canRecruit(heroDef) {
      return gs.gold >= heroDef.costGold && gs.prestige >= heroDef.costPrestige
    }

    function recruitHero(hid) {
      const def = HERO_DEFS.find(h=>h.id===hid)
      if (!def || gs.heroes.find(h=>h.id===hid)) return
      if (!isHeroUnlocked(def)) { addStory(`【${def.name}】招募条件未满足！`, 'warning'); return }
      if (!canRecruit(def)) { addStory('金币或威望不足！', 'warning'); return }
      gs.gold -= def.costGold; gs.prestige -= def.costPrestige
      gs.heroes.push({
        ...def, level:1, exp:0, expNext:def.expNext||100, loyalty:70, affection:30,
        assignedTo:null,
        atk:def.atk, int:def.int, cmd:def.cmd, pol:def.pol, chm:def.chm
      })
      addStory(`【${def.name}】加入屯兵寨！`, 'reward')
      addStory(`"${def.title}${def.name}来了！"`, 'npc')
    }

    function heroAssign(hid) {
      const hero = gs.heroes.find(h=>h.id===hid)
      if (!hero) return
      const opts = [{ text:'取消分配（待命）', action:()=>{ const ob=gs.buildings.find(b=>b.assignedHero===hid); if(ob)ob.assignedHero=null; hero.assignedTo=null; addStory(`${hero.name}回归待命状态。`,'system') } }]
      for (const b of gs.buildings) {
        opts.push({ text:`分配至【${b.name}】`, style:'primary', action:()=>{
          const ob = gs.buildings.find(ob=>ob.assignedHero===hid); if(ob) ob.assignedHero=null
          const ob2 = gs.buildings.find(b2=>b2.id===b.id); if(ob2.assignedHero){const oh=gs.heroes.find(oh=>oh.id===ob2.assignedHero);if(oh)oh.assignedTo=null}
          ob2.assignedHero=hid; hero.assignedTo=b.id
          addStory(`${hero.name}已分配至【${b.name}】。`,'system')
        }})
      }
      setOpts(opts)
    }

    function heroTalk(hid) {
      const h = gs.heroes.find(h=>h.id===hid)
      if (!h) return
      h.affection = Math.min(100, (h.affection||30)+3)
      const lines = [`"主公有何吩咐？"`, `"今日天色不错，正适合操练。"`, `"某家自当尽力！"`, `"主公放心，某绝不退缩！"`]
      addStory(`${h.name}：${lines[Math.floor(Math.random()*lines.length)]}`, 'npc')
      addStory(`（好感 +3，当前好感：${h.affection}）`, 'system')
    }

    function heroGift(hid) {
      const h = gs.heroes.find(h=>h.id===hid)
      if (!h) return
      setOpts([
        { text:`美酒（50金）`, style:'primary', action:()=>{
          if(gs.gold<50){addStory('钱不够！','warning');return}
          gs.gold-=50; const bonus=h.favorite==='美酒'?15:5
          h.affection=Math.min(100,(h.affection||30)+bonus)
          addStory(`赠送美酒给${h.name}，好感+${bonus}。`,'reward')
        }},
        { text:`名剑（200金）`, style:'primary', action:()=>{
          if(gs.gold<200){addStory('钱不够！','warning');return}
          gs.gold-=200; const bonus=h.favorite==='名剑'?25:10
          h.affection=Math.min(100,(h.affection||30)+bonus)
          addStory(`赠送名剑给${h.name}，好感+${bonus}。`,'reward')
        }},
        { text:`战马（500金）`, style:'primary', action:()=>{
          if(gs.gold<500){addStory('钱不够！','warning');return}
          gs.gold-=500; const bonus=h.favorite==='良马'||h.favorite==='战马'?35:15
          h.affection=Math.min(100,(h.affection||30)+bonus)
          addStory(`赠送战马给${h.name}，好感+${bonus}。`,'reward')
        }},
        { text:'取消' }
      ])
    }

    function checkAutoHeroVisit() {
      const hall = bldLevel('guildhall')
      if (hall >= 2 && !gs.heroes.find(h=>h.id==='weizhen') && !gs.defeatedFactions.includes('_weizhen_visited')) {
        gs.defeatedFactions.push('_weizhen_visited')
        addStory('---')
        addStory('一位须发皆白的文士来到寨门，自称魏徵，欲投效麾下。', 'event')
        setOpts([{ text:'盛情迎入（花费200金招募）', style:'primary', action:()=>{
          if(gs.gold<200){addStory('金币不足，无法招募！','warning');return}
          gs.gold-=200
          gs.heroes.push({ ...HERO_DEFS.find(h=>h.id==='weizhen'), level:1, exp:0, expNext:100, loyalty:80, affection:50, assignedTo:null })
          addStory('魏徵正式加入屯兵寨！', 'reward')
        }}, { text:'婉言拒绝' }])
      }
      if (hall >= 3 && !gs.heroes.find(h=>h.id==='xueMaoJun') && !gs.defeatedFactions.includes('_xu_visited')) {
        gs.defeatedFactions.push('_xu_visited')
        addStory('---')
        addStory('徐茂公徐军师风尘仆仆赶来，听闻主公大名，特来效力！', 'event')
        setOpts([{ text:'热情留下（花费400金招募）', style:'primary', action:()=>{
          if(gs.gold<400){addStory('金币不足，无法招募！','warning');return}
          gs.gold-=400
          gs.heroes.push({ ...HERO_DEFS.find(h=>h.id==='xueMaoJun'), level:1, exp:0, expNext:120, loyalty:75, affection:40, assignedTo:null })
          addStory('徐茂公正式加入屯兵寨！', 'reward')
        }}, { text:'婉言拒绝' }])
      }
    }

    // ---- 军事 / 战斗 ----
    function trainTroops(type) {
      const td = TROOP_TYPES[type]
      if (!td) return
      if (td.unlockBld && !hasBld(td.unlockBld)) { addStory(`需先建造${getBldNameById(td.unlockBld)}！`, 'warning'); return }
      const cnt = trainCount[type] || 1
      const goldCost = (td.costGold||0) * cnt
      const foodCost = td.costFood * cnt
      const ironCost = (td.costIron||0) * cnt
      // 军营折扣
      const barrackLv = bldLevel('barracks')
      const discount = 1 - barrackLv * 0.05
      const actualGold = Math.floor(goldCost * discount)
      const actualFood = Math.floor(foodCost * discount)
      if (gs.gold < actualGold || gs.food < actualFood || gs.iron < ironCost) {
        addStory('资源不足！', 'warning'); return
      }
      gs.gold -= actualGold; gs.food -= actualFood; gs.iron -= ironCost
      gs.troops[type] = (gs.troops[type]||0) + cnt
      addStory(`训练了 ${cnt} 名${td.name}！${barrackLv>0?`（军营折扣${Math.floor(barrackLv*5)}%）`:''}`, 'system')
    }

    function initFactionBattle(fid) {
      if (gs.defeatedFactions.includes(fid)) { addStory('该势力已被击败！', 'warning'); return }
      const faction = FACTIONS.find(f=>f.id===fid)
      if (!faction) return
      if (myPower.value < faction.powerReq * 0.6) { addStory('战力严重不足，强行出征恐遭大败！', 'warning'); return }
      addStory('---')
      addStory(`【出征】目标：${faction.name} | 首领：${faction.leader}`, 'event')
      addStory(`${faction.combatLines[0]}`, 'npc')
      combat.active = true
      combat.factionId = fid
      combat.phase = 'fighting'
      combat.round = 1
      const allyHP = totalTroops.value * 10 + gs.heroes.length * 50
      combat.allyMaxHp = allyHP; combat.allyHp = allyHP
      combat.enemyMaxHp = faction.troopCount * 10; combat.enemyHp = faction.troopCount * 10
      combat.allyMorale = 80; combat.enemyMorale = 100
      combat.win = false
      setOpts([{ text:'发起进攻！', style:'primary', action:doCombatRound },
               { text:'撤退（中止出征）', style:'danger', action:()=>{ combat.active=false; addStory('大军撤退，本次出征中止。', 'warning') } }])
    }

    function doCombatRound() {
      if (!combat.active || combat.phase !== 'fighting') return
      const faction = FACTIONS.find(f=>f.id===combat.factionId)
      if (!faction) return

      // 我方伤害
      const techBonus = 1 + (gs.tech['infantry_tech']||0)*0.05 + (gs.tech['cavalry_tech']||0)*0.04
      const heroBonus = 1 + gs.heroes.length * 0.03
      const baseDmg = Math.max(10, Math.floor(myPower.value * 0.4 * techBonus * heroBonus * (combat.allyMorale/100)))
      const dmg = baseDmg + Math.floor(Math.random()*baseDmg*0.3-baseDmg*0.15)
      combat.enemyHp = Math.max(0, combat.enemyHp - dmg)

      // 武将技能触发（30%概率）
      const randomHero = gs.heroes[Math.floor(Math.random()*gs.heroes.length)]
      if (randomHero && Math.random() < 0.3) {
        addStory(`✨ ${randomHero.name}发动【${randomHero.skill}】：${randomHero.skillDesc}！`, 'reward')
        combat.enemyHp = Math.max(0, combat.enemyHp - Math.floor(dmg*0.3))
      }

      // 敌方伤害
      if (combat.enemyHp > 0) {
        const weatherDebuff = WEATHERS[gs.weather].combatMod
        const enemyAtk = faction.powerReq * 0.25 * weatherDebuff * (combat.enemyMorale/100)
        const enemyDmg = Math.max(5, Math.floor(enemyAtk + Math.random()*20-10))
        combat.allyHp = Math.max(0, combat.allyHp - enemyDmg)
        combat.enemyMorale = Math.max(30, combat.enemyMorale - 5)
        combat.allyMorale = Math.max(30, combat.allyMorale - 2)
        const ln = faction.combatLines[Math.min(combat.round, faction.combatLines.length-1)]
        if (combat.round <= faction.combatLines.length) addStory(`${faction.leader}：${ln.split('：')[1]||ln}`, 'npc')
        addStory(`第${combat.round}回合 | 我军攻击 ${dmg} | 敌军反击 ${enemyDmg} | 敌HP：${combat.enemyHp}/${combat.enemyMaxHp}`, 'system')
      }

      combat.round++

      // 判断结果
      if (combat.enemyHp <= 0) {
        // 胜利
        combat.phase = 'result'; combat.win = true
        resolveCombatVictory(faction)
      } else if (combat.allyHp <= 0) {
        // 失败
        combat.phase = 'result'; combat.win = false
        combat.active = false
        addStory('---', 'divider')
        addStory('我军溃败！兵力损失惨重，被迫撤退！', 'warning')
        const loss = Math.floor(totalTroops.value * 0.3)
        gs.troops.infantry = Math.max(0, gs.troops.infantry - loss)
        gs.prestige = Math.max(0, gs.prestige - 20)
        setOpts([])
      } else {
        // 继续
        const hpPct = Math.floor(combat.enemyHp / combat.enemyMaxHp * 100)
        setOpts([{ text:`继续进攻（敌方HP: ${hpPct}%）`, style:'primary', action:doCombatRound },
                 { text:'战略撤退', style:'danger', action:()=>{ combat.active=false; addStory('撤退！我军有序撤离。','warning') } }])
      }
    }

    function resolveCombatVictory(faction) {
      combat.active = false
      gs.defeatedFactions.push(faction.id)
      addStory('---')
      addStory(`🎉 大获全胜！${faction.name}已被击败！`, 'reward')
      gs.gold += faction.rewardGold; gs.food += faction.rewardFood; gs.prestige += faction.rewardPrestige
      addStory(`获得：金${faction.rewardGold} 粮${faction.rewardFood} 威望${faction.rewardPrestige}`, 'reward')
      // 解锁建筑
      if (faction.unlockBlds && faction.unlockBlds.length > 0) {
        addStory(`解锁新建筑：${faction.unlockBlds.map(id=>getBldNameById(id)).join('、')}`, 'reward')
      }
      // 解锁武将
      if (faction.unlockHeroes && faction.unlockHeroes.length > 0) {
        const names = faction.unlockHeroes.map(id=>HERO_DEFS.find(h=>h.id===id)?.name||id).join('、')
        addStory(`可招募新武将：${names}`, 'reward')
      }
      // 特殊事件
      addStory(`特殊事件：${faction.specialEvent}`, 'event')
      // 探索该地点
      const loc = MAP_LOCATIONS.find(l=>l.factionId===faction.id)
      if (loc && !gs.exploredLocations.includes(loc.id)) gs.exploredLocations.push(loc.id)
      // 结局判断
      if (faction.id === 'liyuan') {
        setTimeout(()=>triggerEnding(), 1500)
      }
      clearOpts()
    }

    function triggerEnding() {
      addStory('---')
      addStory('天下已平，传国玉玺在手，万众归心。', 'narrate')
      addStory('你站在长安城楼之上，俯瞰着这片历经战火的土地。', 'narrate')
      addStory('你将如何面对这个全新的天下？', 'narrate')
      setOpts([
        { text:'开创新朝，自立为帝', style:'primary', action:()=>{ addStory('你宣告建立新王朝，天下归一。结局：开创新朝 🏆', 'reward') }},
        { text:'辅佐明主，功成身退', style:'', action:()=>{ addStory('你将玉玺献于明主，隐退山林。结局：功成身退 🌟', 'reward') }},
        { text:'拥兵自重，割据一方', style:'', action:()=>{ addStory('你选择保留军队，割据一方。结局：割据诸侯 ⚔', 'reward') }},
      ])
    }

    // ---- 大地图 ----
    function travelTo(locId) {
      const loc = MAP_LOCATIONS.find(l=>l.id===locId)
      if (!loc) return
      if (gs.actionPoints < loc.distance) { addStory('行动点不足！请先推进几日。', 'warning'); return }
      gs.actionPoints -= loc.distance
      gs.location = loc.name
      if (!gs.exploredLocations.includes(locId)) gs.exploredLocations.push(locId)
      addStory(`前往【${loc.name}】，消耗行动点${loc.distance}。`, 'system')
      // 随机触发地点事件
      if (loc.events && Math.random() < 0.6) {
        const ev = loc.events[Math.floor(Math.random()*loc.events.length)]
        addStory(`在${loc.name}发现：${ev}`, 'event')
      }
      if (loc.factionId && !gs.defeatedFactions.includes(loc.factionId)) {
        addStory(`⚠ 此地由【${FACTIONS.find(f=>f.id===loc.factionId)?.name||'未知势力'}】控制，小心行事！`, 'warning')
      }
    }

    function exploreLoc(locId) {
      const loc = MAP_LOCATIONS.find(l=>l.id===locId)
      if (!loc) return
      if (!gs.exploredLocations.includes(locId)) gs.exploredLocations.push(locId)
      addStory(`探索了【${loc.name}】！`, 'reward')
      gs.prestige += 5
      if (Math.random() < 0.4) { gs.gold += 100; addStory('发现了隐藏的财宝！金+100', 'reward') }
    }

    function renderMap() {
      const rows = 11
      const cols = 14
      const grid = Array(rows).fill(null).map(()=>Array(cols).fill('  '))
      for (const loc of MAP_LOCATIONS) {
        if (loc.x < cols && loc.y < rows) {
          const isExplored = gs.exploredLocations.includes(loc.id)
          const isCur = loc.name === gs.location
          const isEnemy = loc.factionId && !gs.defeatedFactions.includes(loc.factionId)
          const tag = isCur ? `<span class="cur">[${loc.icon}]</span>` : isExplored ? (isEnemy ? `<span class="enemy">[${loc.icon}]</span>` : `<span class="explored">[${loc.icon}]</span>`) : `<span style="color:var(--border)">[?]</span>`
          grid[loc.y][loc.x] = tag
        }
      }
      return grid.map(r=>r.join('')).join('\n')
    }

    // ---- 科技 ----
    function getTechCost(tid) {
      const t = TECH_DEFS.find(t=>t.id===tid)
      if (!t) return { gold:0 }
      const lv = gs.tech[tid] || 0
      return { gold: Math.floor(t.baseCost.gold * Math.pow(t.costMult, lv)), prestige: Math.floor((t.baseCost.prestige||0) * Math.pow(t.costMult, lv)) }
    }

    function canResearch(tid) {
      const cost = getTechCost(tid)
      return gs.gold >= cost.gold && gs.prestige >= (cost.prestige||0)
    }

    function researchTech(tid) {
      const t = TECH_DEFS.find(t=>t.id===tid)
      if (!t) return
      const lv = gs.tech[tid] || 0
      if (lv >= t.maxLvl) { addStory('已达最高级！', 'warning'); return }
      if (!canResearch(tid)) { addStory('资源不足！', 'warning'); return }
      const cost = getTechCost(tid)
      gs.gold -= cost.gold; gs.prestige -= (cost.prestige||0)
      gs.tech[tid] = lv + 1
      addStory(`${t.name}升级到Lv.${gs.tech[tid]}！`, 'reward')
      addStory(`效果：${t.effects[gs.tech[tid]]}`, 'system')
    }

    // ---- 日推进 ----
    function advanceDay() {
      if (gs.options.length > 0) { addStory('请先处理当前选择！', 'warning'); return }

      // 更新日期
      gs.dayInSeason++
      if (gs.dayInSeason > 22) {
        gs.dayInSeason = 1
        gs.season++
        if (gs.season > 4) { gs.season = 1; gs.year++ }
        addStory(`季节更迭：进入${gs.year}年${SEASONS[gs.season-1]}季。`, 'event')
      }
      // 天气
      const wProp = gs.season===4 ? [0.2,0.3,0.1,0,0.1,0.3,0] : gs.season===3 ? [0.3,0.2,0.2,0.1,0.1,0,0.1] : gs.season===2 ? [0.4,0.1,0.2,0.1,0.1,0,0.2] : [0.3,0.2,0.3,0.1,0.1,0,0]
      let r = Math.random(); let wi = 0; for (let i=0;i<wProp.length;i++){r-=wProp[i];if(r<=0){wi=i;break;}}
      gs.weather = wi

      // 建筑产出
      let foodProd=0, woodProd=0, ironProd=0, goldProd=0, prestigeProd=0
      const wm = WEATHERS[gs.weather]
      for (const b of gs.buildings) {
        if (b.underConstruction) { b.constructDays--; if(b.constructDays<=0)b.underConstruction=false; continue }
        const def = BLD_DEFS.find(d=>d.id===b.id)
        if (!def) continue
        const heroBoost = getHeroBoost(b)
        const base = Math.floor((def.baseOutput||0) * b.level * (1+heroBoost))
        if (def.outputType==='food') foodProd += Math.floor(base * wm.foodMod * getAgriBonus())
        else if (def.outputType==='wood') woodProd += Math.floor(base*0.5)
        else if (def.outputType==='iron') ironProd += Math.floor(base*0.3)
        else if (def.outputType==='gold') goldProd += base
        else if (def.outputType==='prestige') prestigeProd += base
      }
      // 人口基础收入
      goldProd += Math.floor(gs.population * 0.3 + gs.prestige * 0.1)
      gs.food += foodProd; gs.wood += woodProd; gs.iron += ironProd; gs.gold += goldProd; gs.prestige += prestigeProd

      // 消耗
      const logisticsBonus = (gs.tech['agri_tech']||0) >= 2 ? 0.95 : 1.0
      const foodCost = Math.max(1, Math.floor((gs.population * 1.5 + totalTroops.value * 2) * logisticsBonus))
      gs.food -= foodCost
      if (gs.food < 0) {
        gs.food = 0; gs.loyalty = Math.max(0, gs.loyalty - 5)
        addStory('⚠ 粮食告罄！民心下降！', 'warning')
      }
      if (gs.loyalty < 30) addStory('⚠ 民忠极低，恐有叛乱！', 'warning')

      // 民忠自然恢复
      if (gs.food > 0 && gs.loyalty < 80) gs.loyalty = Math.min(80, gs.loyalty + 1)

      // 行动点恢复
      gs.actionPoints = Math.min(10, gs.actionPoints + 2)

      // 武将经验成长
      for (const h of gs.heroes) {
        const expGain = Math.floor(5 * (1 + (h.passive||'').includes('经验')?0.3:0))
        h.exp = (h.exp||0) + expGain
        while (h.exp >= h.expNext) {
          h.exp -= h.expNext; h.level++
          h.atk += (h.growth?.atk||1); h.int += (h.growth?.int||0.5)
          h.cmd += (h.growth?.cmd||1); h.pol += (h.growth?.pol||0.5)
          h.chm += (h.growth?.chm||0.5)
          h.expNext = Math.floor(h.expNext * 1.5)
          addStory(`${h.name}升级至Lv.${h.level}！`, 'reward')
        }
        // 忠诚度自然变化
        if (h.loyalty < 100) h.loyalty = Math.min(100, h.loyalty + (h.passive||'').includes('桀骜') ? -0.5 : 0.3)
      }

      // 随机事件（约30%概率）
      if (Math.random() < 0.3) triggerRandomEvent()

      // 日志
      addStory(`第${gs.year}年${SEASONS[gs.season-1]}季第${gs.dayInSeason}日 ${wm.icon}${wm.name}`, 'system')
      if (foodProd > 0 || goldProd > 0) {
        addStory(`产出：粮+${foodProd} 金+${goldProd}${woodProd>0?` 木+${woodProd}`:''}${ironProd>0?` 铁+${ironProd}`:''}${prestigeProd>0?` 威+${prestigeProd}`:''}  消耗：粮-${foodCost}`, 'system')
      }
    }

    function getAgriBonus() {
      const tech = gs.tech['agri_tech'] || 0
      return 1 + tech * 0.1
    }

    function getHeroBoost(bld) {
      if (!bld.assignedHero) return 0
      const h = gs.heroes.find(h=>h.id===bld.assignedHero)
      if (!h) return 0
      const def = BLD_DEFS.find(d=>d.id===bld.id)
      if (!def) return 0
      if (def.outputType==='food') return Math.floor(h.pol/10) * 0.05
      if (def.outputType==='wood'||def.outputType==='iron') return Math.floor((h.atk+h.pol)/15) * 0.05
      if (def.outputType==='gold') return Math.floor((h.pol+h.chm)/15) * 0.05
      return 0
    }

    function triggerRandomEvent() {
      const ev = RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)]
      addStory('---')
      addStory(`📜 ${ev.text}`, 'event')
      setOpts(ev.options.map((opt,i)=>({ text:opt, style:i===0?'primary':'', action:()=>applyEventEffect(ev.effect[i]) })))
    }

    function applyEventEffect(eff) {
      if (!eff) return
      if (eff.gold) gs.gold = Math.max(0, gs.gold + eff.gold)
      if (eff.food) gs.food = Math.max(0, gs.food + eff.food)
      if (eff.wood) gs.wood = Math.max(0, gs.wood + eff.wood)
      if (eff.iron) gs.iron = Math.max(0, gs.iron + eff.iron)
      if (eff.prestige) gs.prestige = Math.max(0, gs.prestige + eff.prestige)
      if (eff.loyalty) gs.loyalty = Math.max(0, Math.min(100, gs.loyalty + eff.loyalty))
      if (eff.population) gs.population += eff.population
      if (eff.population_loss) gs.population = Math.max(1, gs.population - eff.population_loss)
      if (eff.rand_hero) {
        const pool = HERO_DEFS.filter(h=>h.rank===eff.rand_hero && !gs.heroes.find(rh=>rh.id===h.id))
        if (pool.length > 0) {
          const h = pool[Math.floor(Math.random()*pool.length)]
          gs.heroes.push({ ...h, level:1, exp:0, expNext:h.expNext||100, loyalty:70, affection:30, assignedTo:null })
          addStory(`随机获得武将：【${h.name}】加入！`, 'reward')
        }
      }
      addStory('已处理事件。', 'system')
    }

    // ---- 存档/读档 ----
    function saveGame() {
      const data = {
        gold:gs.gold, food:gs.food, wood:gs.wood, iron:gs.iron,
        prestige:gs.prestige, population:gs.population, loyalty:gs.loyalty,
        year:gs.year, season:gs.season, dayInSeason:gs.dayInSeason,
        weather:gs.weather, difficulty:gs.difficulty,
        buildings:gs.buildings, heroes:gs.heroes, troops:gs.troops, tech:gs.tech,
        defeatedFactions:gs.defeatedFactions, exploredLocations:gs.exploredLocations,
        location:gs.location, actionPoints:gs.actionPoints,
      }
      localStorage.setItem('stjyc_v1', JSON.stringify(data))
      addStory('💾 游戏已保存！', 'system')
    }

    function loadGame() {
      const raw = localStorage.getItem('stjyc_v1')
      if (!raw) return
      try {
        const d = JSON.parse(raw)
        Object.assign(gs, {
          gold:d.gold||1000, food:d.food||500, wood:d.wood||200, iron:d.iron||50,
          prestige:d.prestige||50, population:d.population||20, loyalty:d.loyalty||80,
          year:d.year||1, season:d.season||1, dayInSeason:d.dayInSeason||1,
          weather:d.weather||0, difficulty:d.difficulty||'normal',
          buildings:d.buildings||[], heroes:d.heroes||[],
          troops:d.troops||{infantry:10,archers:0,musketeers:0,cavalry:0},
          tech:d.tech||{},
          defeatedFactions:d.defeatedFactions||[], exploredLocations:d.exploredLocations||['taiyuan'],
          location:d.location||'太原', actionPoints:d.actionPoints||10,
          story:[], options:[],
        })
        gs.started = true
        addStory('📂 读档成功！聚义事业继续…', 'reward')
      } catch(e) { alert('读档失败：'+e.message) }
    }

    // ---- 开始游戏 ----
    function startGame(diff) {
      Object.assign(gs, {
        started:true, difficulty:diff,
        gold: diff==='hell'?500 : diff==='hard'?800 : 1000,
        food: diff==='hell'?300 : diff==='hard'?400 : 500,
        wood:200, iron:50, prestige:50, population:20, loyalty:80,
        year:1, season:1, dayInSeason:1, weather:0,
        buildings:[], heroes:[], troops:{infantry:10,archers:0,musketeers:0,cavalry:0},
        tech:{}, defeatedFactions:[], exploredLocations:['taiyuan'],
        location:'太原', actionPoints:10, story:[], options:[],
      })
      // 初始故事
      addStory('═'.repeat(32))
      addStory('大业七年，隋炀帝暴政，天下大乱。', 'narrate')
      addStory('你曾是太原府一名小军校，眼见朝廷腐败，民不聊生，遂带三五兄弟出走，于太原山中觅得一处险地。', 'narrate')
      addStory('"就在这里！建一座寨子，聚天下英雄，成就一番大业！"', 'player')
      addStory('【屯兵寨】就此立下！', 'narrate')
      addStory('═'.repeat(32))
      addStory(`难度：${['普通','困难','地狱'][['normal','hard','hell'].indexOf(diff)]} | 初始：金${gs.gold} 粮${gs.food}`, 'system')
      setOpts([{ text:'建造第一座建筑', style:'primary', action:()=>{ activeTab.value='build'; addStory('打开建造面板，先造一座农田或伐木场！','system') } },
               { text:'先查看武将', style:'', action:()=>{ activeTab.value='heroes'; addStory('查看可招募武将。','system') } }])
    }

    const TABS = [
